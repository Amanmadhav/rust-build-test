name: Build and Test
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-java@v1
        with:
          java-version: 111.0.10
      - name: Build with Maven
        run: mvn clean package
      - name: Test
        run: mvn test
      - name: Upload Artifact
        uses: actions/upload-artifact@v2
        with:
          artifact: target/*.jar
          name: Minecraft-rust
          path: target
